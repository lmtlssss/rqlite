name: Local auto-backup metadata publication regression
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Reviewed candidate or baseline proof branch"
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Go format check on affected files
        run: test -z "$(gofmt -l auto/file/file.go auto/file/metadata_rename_failure_test.go)"
      - name: Run deterministic metadata rename fault regression
        run: go test -count=1 -run 'TestUpload(MetadataRenameFailurePreservesLastSuccessfulBackup|FirstMetadataRenameFailureLeavesNoPublishedFile|PayloadRenameFailureKeepsPreviousBackup)$' ./auto/file
      - name: Full auto/file package
        run: go test -count=1 ./auto/file
      - name: Go race on affected paths
        run: go test -race -count=1 -run 'TestUpload(MetadataRenameFailurePreservesLastSuccessfulBackup|FirstMetadataRenameFailureLeavesNoPublishedFile|PayloadRenameFailureKeepsPreviousBackup)$' ./auto/file
