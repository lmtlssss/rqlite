name: rqlite failed-backup-publication regression (isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-local-backup-publication-rollback-20261025
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate original and repaired recovery behavior
        run: go test -count=1 -v -run 'TestUpload(MetadataRenameFailurePreservesLastGoodBackup|RecoveryAfterCrashBetweenDataAndMetadata|RollbackSameSecondTimestampCollision|MetadataRenameFailureWithoutPriorBackup)$' ./auto/file
      - name: Run all file-backed storage client tests
        run: go test -count=1 ./auto/file
      - name: Run race checks on Linux
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./auto/file
      - name: Verify all candidate Go sources are formatted
        # Windows Git checkouts can normalize files to CRLF before gofmt.
        # Linux and macOS enforce exact repository formatting; Windows
        # continues to run the complete behavioral package tests.
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l auto/file/file.go auto/file/file_atomic_test.go auto/file/transaction.go)"
